<div data-properties-surface="modal" class="modal-panel cw-device-modal cw-scanner-modal" role="dialog" aria-modal="true" aria-labelledby="scanner-modal-title" data-generic-block-modal-root data-block-runtime-refresh="autonomous" data-node-id="{{ node_id }}" data-node-kind="scanner">
  <header class="modal-header"><div><span class="panel-kicker">Scanner</span><h2 id="scanner-modal-title">{{ node_title }}</h2></div><button class="ghost-btn" data-close-block-modal type="button" data-i18n="ui.block_kit.close">Close</button></header>
  <div class="device-body">{{ settings }}</div>
  <footer class="device-footer"><span class="field-hint" data-i18n="block.scanner.apply_hint">Changes remain local until you apply them.</span><div class="modal-actions"><button class="ghost-btn" data-close-block-modal type="button" data-i18n="ui.block_kit.cancel">Cancel</button><button class="solid-btn" data-block-apply type="button" disabled data-i18n="ui.block_kit.apply">Apply</button></div></footer>
</div>
